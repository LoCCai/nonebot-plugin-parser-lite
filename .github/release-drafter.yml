template: $CHANGES
name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
exclude-labels:
  - reverted
  - no-changelog
  - skip-changelog
  - invalid
autolabeler:
  - label: "bug"
    title:
      - '/^fix(\([^)]+\))?!?:\s+.+/i'
      - "/:bug:.+/"
      - "/🐛.+/"
  - label: "enhancement"
    title:
      - "/:sparkles:.+/"
      - "/✨.+/"
      - '/^feat(\([^)]+\))?!?:\s+.+/i'
  - label: "chore"
    files:
      - ".github/**"
    title:
      - '/^chore(\([^)]+\))?!?:\s+.+/i'
  - label: "tests"
    files:
      - "tests/**"
    title:
      - '/^tests?(\([^)]+\))?!?:\s+.+/i'
  - label: "breaking-change"
    title:
      - "/.+!:.+/"
  - label: "documentation"
    files:
      - "*.md"
      - api_txt/**/*
  - label: "dependencies"
    files:
      - "requirements.txt"
      - "pyproject.toml"
    title:
      - "/:wrench:.+/"
      - "/🔧.+/"
  - label: "resources"
    files:
      - src/nonebot_plugin_parser_lite/render/templates/**/*
categories:
  - title: 💥 破坏性变更
    exclusive: true
    when:
      labels:
        - breaking-change
  - title: 🚀 新功能
    exclusive: true
    when:
      labels:
        - enhancement
  - title: 🐛 Bug 修复
    exclusive: true
    when:
      labels:
        - bug
  - title: 📝 文档更新
    exclusive: true
    when:
      labels:
        - documentation
  - title: 👻 自动化程序
    exclusive: true
    when:
      labels:
        - chore
  - title: 🚦 测试
    exclusive: true
    when:
      labels:
        - tests
  - title: 📦 依赖更新
    exclusive: true
    when:
      labels:
        - dependencies
    collapse-after: 15
  - title: 🎨 资源更新
    exclusive: true
    when:
      labels:
        - resources
  - title: 💫 杂项
    exclusive: true
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
  patch:
    labels:
      - "patch"
  default: patch
